<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 320" width="300" height="320">
  <!-- Outer gold ring border -->
  <circle cx="150" cy="155" r="148" fill="#c8a000" stroke="#8a6000" stroke-width="2"/>
  <!-- Main green shield background -->
  <circle cx="150" cy="155" r="138" fill="#2d7a2d"/>
  <!-- Inner gold ring -->
  <circle cx="150" cy="155" r="130" fill="none" stroke="#f0c040" stroke-width="3"/>
  
  <!-- Top arch banner: PROVINSI SUMATERA SELATAN -->
  <path id="topArc" d="M 30,155 A 120,120 0 0 1 270,155" fill="none"/>
  <text font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f0c040" text-anchor="middle" letter-spacing="1">
    <textPath href="#topArc" startOffset="50%">PROVINSI SUMATERA SELATAN</textPath>
  </text>

  <!-- Bottom arch banner -->
  <path id="botArc" d="M 30,155 A 120,120 0 0 0 270,155" fill="none"/>
  <text font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f0c040" text-anchor="middle" letter-spacing="1">
    <textPath href="#botArc" startOffset="50%">SRIWIJAYA</textPath>
  </text>

  <!-- Central emblem white circle -->
  <circle cx="150" cy="148" r="78" fill="#f8f0d0" stroke="#f0c040" stroke-width="2"/>
  
  <!-- Ampera Bridge simplified (3 towers) -->
  <!-- Bridge deck -->
  <rect x="80" y="168" width="140" height="6" rx="2" fill="#8b4513"/>
  <!-- Left tower -->
  <rect x="95" y="125" width="12" height="50" rx="2" fill="#8b4513"/>
  <!-- Center tower (main, taller) -->
  <rect x="143" y="110" width="14" height="65" rx="2" fill="#8b4513"/>
  <!-- Right tower -->
  <rect x="193" y="125" width="12" height="50" rx="2" fill="#8b4513"/>
  <!-- Cables left -->
  <line x1="101" y1="128" x2="80" y2="168" stroke="#8b4513" stroke-width="1.5"/>
  <line x1="101" y1="128" x2="143" y2="168" stroke="#8b4513" stroke-width="1.5"/>
  <!-- Cables center -->
  <line x1="150" y1="113" x2="101" y2="168" stroke="#8b4513" stroke-width="1.5"/>
  <line x1="150" y1="113" x2="199" y2="168" stroke="#8b4513" stroke-width="1.5"/>
  <!-- Cables right -->
  <line x1="199" y1="128" x2="199" y2="168" stroke="#8b4513" stroke-width="1.5"/>
  <line x1="199" y1="128" x2="220" y2="168" stroke="#8b4513" stroke-width="1.5"/>

  <!-- Musi River (blue wavy lines) -->
  <path d="M 80 178 Q 100 175 120 180 Q 140 185 160 180 Q 180 175 200 180 Q 215 183 220 180" 
    fill="none" stroke="#1a6bb5" stroke-width="3" stroke-linecap="round"/>
  <path d="M 80 188 Q 100 185 120 190 Q 140 195 160 190 Q 180 185 200 190 Q 215 193 220 190" 
    fill="none" stroke="#1a6bb5" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Lotus flower at bottom center -->
  <ellipse cx="150" cy="210" rx="12" ry="8" fill="#ff8888" stroke="#cc4444" stroke-width="1"/>
  <ellipse cx="133" cy="208" rx="10" ry="6" fill="#ff8888" stroke="#cc4444" stroke-width="1" transform="rotate(-20,133,208)"/>
  <ellipse cx="167" cy="208" rx="10" ry="6" fill="#ff8888" stroke="#cc4444" stroke-width="1" transform="rotate(20,167,208)"/>
  <ellipse cx="150" cy="218" rx="8" ry="5" fill="#ff8888" stroke="#cc4444" stroke-width="1"/>

  <!-- Stars at top (5 stars for Pancasila) -->
  <polygon points="150,88 153,97 162,97 155,103 158,112 150,107 142,112 145,103 138,97 147,97" 
    fill="#f0c040"/>

  <!-- Leaf ornaments left -->
  <path d="M 85 148 Q 75 140 80 130 Q 90 138 85 148Z" fill="#4a9a4a"/>
  <path d="M 80 162 Q 68 155 72 142 Q 84 150 80 162Z" fill="#4a9a4a"/>
  <path d="M 82 175 Q 70 170 73 157 Q 85 163 82 175Z" fill="#4a9a4a"/>

  <!-- Leaf ornaments right -->
  <path d="M 215 148 Q 225 140 220 130 Q 210 138 215 148Z" fill="#4a9a4a"/>
  <path d="M 220 162 Q 232 155 228 142 Q 216 150 220 162Z" fill="#4a9a4a"/>
  <path d="M 218 175 Q 230 170 227 157 Q 215 163 218 175Z" fill="#4a9a4a"/>

  <!-- Bottom decorative banner shape -->
  <path d="M 80 270 L 100 255 L 150 265 L 200 255 L 220 270 L 200 280 L 150 275 L 100 280 Z"
    fill="#f0c040" stroke="#c8a000" stroke-width="1"/>
  <text x="150" y="274" font-family="Arial, sans-serif" font-size="9" font-weight="bold" 
    fill="#2d7a2d" text-anchor="middle">BERSATU</text>
</svg>
